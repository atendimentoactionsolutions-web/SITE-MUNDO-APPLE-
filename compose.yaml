name: mundo-apple-site

services:
  web:
    image: mundo-apple-site-web
    build:
      context: https://github.com/atendimentoactionsolutions-web/SITE-MUNDO-APPLE-.git#main
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    extra_hosts:
      - "srv2058756.hstgr.cloud:host-gateway"
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DB_BACKUP_FILE: /app/data/db_backup.json
      WA_SERVER_URL: http://whatsapp:3001
      PRODUCT_OVERRIDES_FILE: /app/data/products_override.json
      SUPPLIER_STATUS_FILE: /app/data/supplier_sync_status.json
    volumes:
      - app-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  whatsapp:
    image: mundo-apple-site-web
    pull_policy: never
    restart: unless-stopped
    init: true
    command: ["node", "scripts/whatsapp-worker.mjs"]
    environment:
      PORT: 3001
    volumes:
      - whatsapp-session:/app/.whatsapp-session
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  price-sync:
    image: mundo-apple-site-web
    pull_policy: never
    restart: unless-stopped
    init: true
    command: ["node", "scripts/price-sync-worker.mjs"]
    environment:
      SYNC_ENDPOINT: http://web:3000/api/cron/sync-supplier
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('/app/data/price-worker.json')); process.exit(Date.now()-Date.parse(s.lastAttemptAt)<720000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  app-data:
  whatsapp-session:
